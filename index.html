<style>
/* Layout: barra de abas numeradas (fluxo cadastro → cardápio → equipe → orçamento), cartões por estação, barra de totais fixa no rodapé */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#3DB39A; --accent-ink:#06201A; --accent-soft:#183A33; --hi:#E6B652; --hi-soft:#3A2F17; --danger:#F07167; --danger-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#3DB39A; --accent-ink:#06201A; --accent-soft:#183A33; --hi:#E6B652; --hi-soft:#3A2F17; --danger:#F07167; --danger-soft:#3B1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 120px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

.tabs{display:grid;grid-template-columns:repeat(var(--ntabs,3),1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:20px}

<script>
/* ===== Supabase: login + banco (mesma interface do banco usado dentro do Claude) ===== */
const SUPABASE_URL='https://tpaqxdycyitgcirusobj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_iAt92zFPOyyrcSyd1Qxxdw_JeI2nOp3';
(function(){
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const T='app_docs';
  const listeners=new Set();
  function snapDoc(row){return{exists:!!row,data:()=>row?row.data:undefined}}
  function parse(p){const i=p.indexOf('/');return{col:p.slice(0,i),id:p.slice(i+1)}}
  async function fetchDoc(col,id){const {data,error}=await sb.from(T).select('data').eq('collection',col).eq('id',id).maybeSingle();if(error)throw error;return data}
  async function fetchCol(col){const {data,error}=await sb.from(T).select('id,data').eq('collection',col);if(error)throw error;return data||[]}
  function refetchAll(){listeners.forEach(f=>f())}
  let ch=null;
  function ensureChannel(){
    if(ch)return;
    ch=sb.channel('app_docs_all').on('postgres_changes',{event:'*',schema:'public',table:T},()=>refetchAll()).subscribe();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)refetchAll()});
    window.addEventListener('focus',refetchAll);
  }
  function makeDb(){
    ensureChannel();
    return{
      doc(path){const {col,id}=parse(path);return{
        async get(){return snapDoc(await fetchDoc(col,id))},
        async set(body){const {error}=await sb.from(T).upsert({collection:col,id,data:body,updated_at:new Date().toISOString()});if(error)throw error},
        onSnapshot(ok,err){const run=async()=>{try{ok(snapDoc(await fetchDoc(col,id)))}catch(e){err&&err(e)}};listeners.add(run);run();return()=>listeners.delete(run)}
      }},
      collection(col){return{
        doc(id){return{
          async set(body){const {error}=await sb.from(T).upsert({collection:col,id,data:body,updated_at:new Date().toISOString()});if(error)throw error},
          async delete(){const {error}=await sb.from(T).delete().eq('collection',col).eq('id',id);if(error)throw error}
        }},
        orderBy(field,dir){return{onSnapshot(ok,err){const run=async()=>{try{
          let rows=(await fetchCol(col)).map(r=>({data:()=>r.data}));
          rows.sort((a,b)=>String(a.data()[field]||'').localeCompare(String(b.data()[field]||''))*(dir==='desc'?-1:1));
          ok({docs:rows})}catch(e){err&&err(e)}};listeners.add(run);run();return()=>listeners.delete(run)}}}
      }}
    };
  }
  function showLogin(){
    return new Promise(resolve=>{
      const box=document.createElement('div');box.id='login';
      box.innerHTML='<form><h2>Precificador de Eventos</h2><p>Entre com o e-mail e a senha cadastrados.</p><label class="f">E-mail<input type="email" id="lg-email" autocomplete="username" required></label><label class="f">Senha<input type="password" id="lg-pass" autocomplete="current-password" required></label><div class="err" id="lg-err"></div><button class="btn primary big" type="submit">Entrar</button></form>';
      document.body.appendChild(box);
      box.querySelector('form').addEventListener('submit',async e=>{
        e.preventDefault();const b=box.querySelector('button');b.disabled=true;
        const {error}=await sb.auth.signInWithPassword({email:box.querySelector('#lg-email').value.trim(),password:box.querySelector('#lg-pass').value});
        if(error){box.querySelector('#lg-err').textContent='E-mail ou senha incorretos.';b.disabled=false;return}
        box.remove();resolve();
      });
    });
  }
  window.__getDb=async function(){
    const {data}=await sb.auth.getSession();
    if(!data.session)await showLogin();
    const st=document.getElementById('status');
    if(st&&!document.getElementById('sair')){const b=document.createElement('button');b.id='sair';b.className='btn ghost';b.textContent='Sair';b.onclick=async()=>{await sb.auth.signOut();location.reload()};st.after(b)}
    return makeDb();
  };
})();
</script>

<script>
/* ---------- utilidades ---------- */
const UNIDADES=['und','porção','g','kg','ml','L'];
const INT_UN=new Set(['und','porção']);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).trim().replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n};
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const qf=(v,un)=>(INT_UN.has(un)?Math.round(v):Math.round(v*100)/100).toLocaleString('pt-BR',{maximumFractionDigits:2});
const nf=v=>v==null||v===''?'':String(v).replace('.',',');
const uid=()=>Math.random().toString(36).slice(2,9);
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- estado ---------- */
let db=null, mode='local', loaded=false;
let CAD={tiposEvento:[],estacoes:[],setores:[]};

const emptyDraft=()=>({telefone:'',custosConfirmados:false,turno:'dia',drinks:false,eqAjuste:{},cliente:'',data:'',tipoId:'',convidados:'100',local:'',horario:'',estacoes:[],equipe:[],extras:[],margemComida:'35',margemEquipe:'20',editingId:null,pacoteId:null,observacoes:''});

const TIPOS_EST_PADRAO=[{id:'te-ent',nome:'Entradas',regra:'salgados'},{id:'te-pri',nome:'Pratos Principais',regra:'proteina'},{id:'te-gua',nome:'Guarnições',regra:'guarnicao'},
  {id:'te-sal',nome:'Saladas',regra:''},{id:'te-sob',nome:'Sobremesas',regra:'sobremesa'},{id:'te-beb',nome:'Bebidas',regra:'bebidas'},{id:'te-cafe',nome:'Café da Manhã',regra:''}];

function normCad(c){c=c||{};return{tiposEstacao:(c.tiposEstacao?.length?c.tiposEstacao:clone(TIPOS_EST_PADRAO)),tiposEvento:(c.tiposEvento||[]),estacoes:(c.estacoes||[]).map(e=>({...e,pratos:e.pratos||[]})),setores:(c.setores||[]).map(s=>({...s,funcoes:s.funcoes||[]})),
  pacotes:(c.pacotes||[]).map(p=>({...p,itens:p.itens||[]})),empresa:Object.assign({nome:'',contato:'',obs:'Proposta válida por 15 dias. Reserva da data mediante sinal de 50%.'},c.empresa||{}),
  equipeValores:(c.equipeValores||{}),regras:Object.assign({salgados:9,proteinaDupla:100,guarnicao:150,sucoLitros:2,sucoPessoas:4,sobremesa:120},c.regras||{})}}
/* valor de referência por pessoa de um cardápio fixo */
function pacoteRef(P){let c=0;(P.itens||[]).forEach(it=>{const E=CAD.estacoes.find(e=>e.id===it.estId);const pr=E?.pratos.find(p=>p.id===it.pratoId);if(pr)c+=(num(pr.fator)||0)*custoPrato(pr)});const m=num(P.margem);return{custo:c,venda:c*(1+(m??(num(DRAFT.margemComida)||0))/100)}}
function pacoteDiff(d=DRAFT){
  const P=CAD.pacotes.find(p=>p.id===d.pacoteId);if(!P)return null;
  const key=(e,p)=>e+'|'+p;const inP=new Set(P.itens.map(i=>key(i.estId,i.pratoId)));const inD=new Set();
  d.estacoes.forEach(s=>s.itens.forEach(i=>inD.add(key(s.estId,i.pratoId))));
  const nome=k=>{const [e,p]=k.split('|');return CAD.estacoes.find(x=>x.id===e)?.pratos.find(x=>x.id===p)?.nome||'(prato removido)'};
  return{pacote:P,adicionados:[...inD].filter(k=>!inP.has(k)).map(nome),removidos:[...inP].filter(k=>!inD.has(k)).map(nome)};
}

let FT={insumos:[],fichas:[]};
const nrm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\bkg\b/g,'').replace(/[^a-z0-9]/g,'');
function normFT(f){f=f||{};return{insumos:(f.insumos||[]),fichas:(f.fichas||[]).map(x=>({...x,itens:x.itens||[]})),atualizadoEm:f.atualizadoEm||'',fonte:f.fonte||''}}
let _im=null,_imKey=null;
function insMap(){if(_imKey!==FT.insumos){_im=new Map(FT.insumos.map(i=>[i.id,i]));_imKey=FT.insumos}return _im}
const fichaById=id=>FT.fichas.find(f=>f.id===id);
function itemCusto(it){const I=insMap().get(it.i);return (num(it.q)||0)*(num(I?.preco)||0)}
function fichaCusto(F){return F.itens.reduce((s,it)=>s+itemCusto(it),0)}
function fichaUn(F){const n=num(F.n)||0;return n?fichaCusto(F)/n:0}
function custoPrato(P){const F=P?.fichaId?fichaById(P.fichaId):null;return F?fichaUn(F):(num(P?.custo)||0)}
const FT_CATS=()=>[...new Set([...(CAD.tiposEstacao||[]).map(t=>t.nome),...FT.fichas.map(f=>f.cat||'Outras')])].filter(Boolean);
const qtdF=(v,u)=>u==='un'?String(Math.ceil(v-1e-9)):(Math.round(v*1000)/1000).toLocaleString('pt-BR',{minimumFractionDigits:u==='kg'||u==='L'?3:0,maximumFractionDigits:3});

function updFichaCells(fi){const F=FT.fichas[fi];if(!F)return;
  F.itens.forEach((it,ii)=>{const c=document.querySelector(`[data-ftc="${fi}.${ii}"]`);if(c)c.textContent=brl(itemCusto(it))});
  const t=brl(fichaCusto(F));document.querySelectorAll(`[data-ftt="${fi}"],[data-ftt2="${fi}"]`).forEach(c=>c.textContent=t);
  const u=document.querySelector(`[data-ftu="${fi}"]`);if(u)u.textContent=`${brl(fichaUn(F))} / ${F.und}`}

/* ---------- planilha: importar / exportar ---------- */
function parsePreco(v){if(typeof v==='number')return v;let s=String(v??'').replace(/R\$/i,'').replace(/\s/g,'');if(!s||s==='-')return null;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?null:n}
async function lerPlanilha(file){
  const msg=$('#ft-msg');
  if(!window.XLSX){msg.textContent='Leitor de planilha não carregou. Recarregue a página.';return}
  try{
    const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});
    const linhas=[];
    wb.SheetNames.forEach(sn=>{
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      for(let h=0;h<Math.min(rows.length,12);h++){
        const hd=rows[h].map(x=>nrm(x));
        const cN=hd.findIndex(x=>/insumo|descpro|produto|descricao|item/.test(x)),cP=hd.findIndex(x=>/preco|valor/.test(x));
        if(cN<0||cP<0)continue;const cC=hd.findIndex(x=>/^cod/.test(x));
        for(let r=h+1;r<rows.length;r++){const nome=String(rows[r][cN]||'').trim();const p=parsePreco(rows[r][cP]);if(!nome||p==null)continue;linhas.push({nome,preco:p,cod:cC>=0?String(rows[r][cC]).trim():''})}
        break;
      }
    });
    if(!linhas.length){msg.textContent='Não achei colunas de insumo e preço nessa planilha.';return}
    const byCod=new Map(FT.insumos.filter(i=>i.cod).map(i=>[String(i.cod),i]));const byNome=new Map();
    FT.insumos.forEach(i=>{byNome.set(nrm(i.nome),i);if(i.alias)byNome.set(nrm(i.alias),i)});
    const mudou=[],novos=[],vistos=new Set();let igual=0;
    linhas.forEach(l=>{const I=(l.cod&&byCod.get(l.cod))||byNome.get(nrm(l.nome));
      if(!I){if(l.preco>0&&!novos.some(n=>nrm(n.nome)===nrm(l.nome)))novos.push({...l,add:false});return}
      if(vistos.has(I.id))return;vistos.add(I.id);
      if(l.preco<=0){igual++;return}
      const de=num(I.preco)||0;if(Math.abs(de-l.preco)<0.005)igual++;else mudou.push({id:I.id,nome:I.nome,de,para:l.preco})});
    ui.imp={arquivo:file.name,lidas:linhas.length,mudou,igual,novos};renderFichas();
  }catch(e){console.error(e);msg.textContent='Não consegui ler esse arquivo.'}
}
function aplicarImport(){
  const im=ui.imp;if(!im)return;const map=insMap();
  im.mudou.forEach(m=>{const I=map.get(m.id);if(I){I.preco=m.para;delete I.estimado}});
  im.novos.filter(n=>n.add).forEach(n=>FT.insumos.push({id:uid(),nome:n.nome,cat:'Outros',und:'kg',preco:n.preco,cod:n.cod||undefined,alias:n.nome}));
  FT.insumos.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  FT.atualizadoEm=new Date().toISOString();FT.fonte=im.arquivo;ui.imp=null;saveFT();renderFichas();
  const m=$('#ft-msg');if(m){m.className='msg ok';m.textContent=`${im.mudou.length} preços atualizados`}
}
async function getDl(){
  try{if(window.claude?.use){const d=await window.claude.use('downloads');if(d)return d}}catch{}
  return{save:async({filename,data})=>{
    const tipo=filename.endsWith('.pdf')?'application/pdf':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:tipo}));a.download=filename;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
}
async function baixarModelo(btn){
  const m=$('#ft-msg');if(!window.XLSX){m.textContent='Leitor de planilha não carregou.';return}
  const dl=await getDl();if(!dl){m.textContent='Download indisponível nesta visualização.';return}
  btn.disabled=true;
  try{
    const aoa=[['Código','Insumo','Categoria','Und','Preço (R$)']].concat(FT.insumos.map(I=>[I.cod||'',I.nome,I.cat||'',I.und,num(I.preco)||0]));
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:9},{wch:34},{wch:14},{wch:6},{wch:12}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Preços');
    await dl.save({filename:`Precos insumos ${new Date().toISOString().slice(0,10)}.xlsx`,data:XLSX.write(wb,{bookType:'xlsx',type:'array'})});
    m.className='msg ok';m.textContent='Planilha salva';
  }catch(e){m.className='msg';m.textContent=e?.code==='declined'?'Download cancelado':'Não foi possível gerar a planilha';console.error(e)}
  finally{btn.disabled=false}
}

/* ---------- lista de compras por estação ---------- */
function comprasDe(o){
  const map=insMap();const total=new Map();
  const est=o.estacoes.map(s=>{
    const acc=new Map(),preps=[],semFicha=[];
    s.itens.forEach(it=>{const F=it.fichaId?fichaById(it.fichaId):null;
      if(!F||!(num(F.n)>0)){semFicha.push(it);return}
      const fac=(+it.qtd||0)/num(F.n);preps.push({nome:it.nome,qtd:it.qtd,unidade:it.unidade,ficha:F.nome});
      F.itens.forEach(x=>{const q=(num(x.q)||0)*fac;acc.set(x.i,(acc.get(x.i)||0)+q);total.set(x.i,(total.get(x.i)||0)+q)})});
    const linhas=[...acc].map(([id,q])=>{const I=map.get(id);return{nome:I?.nome||'(insumo removido)',cat:I?.cat||'',und:I?.und||'',qtd:q,custo:q*(num(I?.preco)||0)}}).sort((a,b)=>a.cat.localeCompare(b.cat)||a.nome.localeCompare(b.nome));
    return{nome:s.nome,preps,semFicha,linhas,custo:linhas.reduce((t,l)=>t+l.custo,0)};
  });
  const cons=[...total].map(([id,q])=>{const I=map.get(id);return{nome:I?.nome||'(insumo removido)',cat:I?.cat||'Outros',und:I?.und||'',qtd:q,custo:q*(num(I?.preco)||0)}}).sort((a,b)=>a.cat.localeCompare(b.cat)||a.nome.localeCompare(b.nome));
  return{est,cons,custo:cons.reduce((t,l)=>t+l.custo,0)};
}

  const C=comprasDe(o);

      doc.text('INSUMO',cols[0].x,y);doc.text('QUANTIDADE',cols[1].x,y,{align:'right'});doc.text('UND',cols[2].x,y);doc.text('CUSTO EST.',cols[3].x,y,{align:'right'});y+=6};
    const need=(h,rep)=>{if(y+h>H-18){doc.addPage();y=M+4;if(rep)head()}};
    const linha=l=>{need(5.4,true);doc.setFont('helvetica','normal');doc.setFontSize(9.5);color(INK);
      const t=doc.splitTextToSize(l.nome,cols[0].w);doc.text(t[0]+(t.length>1?'…':''),cols[0].x,y);

    doc.text(`${o.codigo} · uso interno`,M,20);doc.text(`Emitida em ${new Date().toLocaleDateString('pt-BR')}`,W-M,13,{align:'right'});
    y=36;color(INK);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(o.cliente||'Cliente não informado',M,y);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);color(MUT);
    doc.text(`${o.tipoNome||'Evento'} · ${dataBR(o.data)}${o.horario?' às '+o.horario:''} · ${o.convidados} convidados${o.local?' · '+o.local:''}`.slice(0,120),M,y+5.5);
    y+=13;

function tipoDaEstacao(E){if(E.tipo!==undefined)return E.tipo;const k=nrm(E.nome);const t=(CAD.tiposEstacao||[]).find(t=>{const n=nrm(t.nome);return n===k||n.startsWith(k)||k.startsWith(n)||n.slice(0,5)===k.slice(0,5)});return t?t.nome:''}

  const linked=new Set();
  CAD.estacoes.slice().forEach(E=>{E.pratos.slice().forEach(P=>{const F=P.fichaId&&fichaById(P.fichaId);if(!F)return;linked.add(F.id);if(!F.cat||E.tipo===F.cat)return;

    (CAD.pacotes||[]).forEach(pk=>pk.itens.forEach(i=>{if(i.pratoId===P.id&&i.estId===E.id)i.estId=D.id}));
    const sE=DRAFT.estacoes.find(x=>x.estId===E.id);if(sE){const it=sE.itens.filter(i=>i.pratoId===P.id);if(it.length){sE.itens=sE.itens.filter(i=>i.pratoId!==P.id);let sD=DRAFT.estacoes.find(x=>x.estId===D.id);if(!sD){sD={estId:D.id,itens:[]};DRAFT.estacoes.push(sD)}sD.itens.push(...it);saveDraft()}}
    moved.push(`${P.nome} → ${D.nome}`);cadPending=true})});
  FT.fichas.forEach(F=>{if(linked.has(F.id)||!F.cat||!F.nome)return;let D=CAD.estacoes.find(x=>x.tipo===F.cat);if(!D){D={id:uid(),nome:F.cat,tipo:F.cat,pratos:[]};CAD.estacoes.push(D)}

}

const EQUIPE_PADRAO=[
  {id:'coz-lider',setor:'Cozinha',nome:'Líder responsável',dia:200,noite:200,regra:'fixo'},

  auxbar:'nenhum até 100 pessoas, +1 a cada 100',drinks:'só com drinks: 1 a cada 100 pessoas',garcom:'3 a cada 100 pessoas',cumim:'2 a cada 100 pessoas',recepcao:'nenhuma até 100 pessoas, depois 1 a cada 100'};
function qtdRegra(r,n,drinks){const b=Math.max(1,Math.ceil(n/100));
  return {fixo:1,por100:b,auxcoz:b+1,auxbar:b-1,drinks:drinks?b:0,garcom:3*b,cumim:2*b,recepcao:n>100?b:0}[r]??0}
function equipeCad(){const v=CAD.equipeValores||{};return EQUIPE_PADRAO.map(f=>({...f,dia:num(v[f.id]?.dia)??f.dia,noite:num(v[f.id]?.noite)??f.noite}))}
function equipeCalc(d,n,me){
  const noite=d.turno==='noite',aj=d.eqAjuste||{};const setores=[];
  equipeCad().forEach(f=>{
    const auto=qtdRegra(f.regra,n,!!d.drinks),vPad=noite?f.noite:f.dia;
    const q=num(aj[f.id]?.qtd)??auto,v=num(aj[f.id]?.valor)??vPad,c=q*v;
    let S=setores.find(x=>x.nome===f.setor);if(!S){S={nome:f.setor,funcoes:[]};setores.push(S)}
    S.funcoes.push({id:f.id,nome:f.nome,regra:f.regra,auto,qtd:q,valorPadrao:vPad,valor:v,custo:c,venda:c*(1+me),ajustado:num(aj[f.id]?.qtd)!=null||num(aj[f.id]?.valor)!=null});
  });
  setores.forEach(S=>{S.custo=sum(S.funcoes,'custo');S.venda=S.custo*(1+me)});
  return setores;
}
function calc(d=DRAFT){
  const n=Math.max(0,num(d.convidados)||0),mc=(num(d.margemComida)||0)/100,me=(num(d.margemEquipe)||0)/100;
  const est=d.estacoes.map(s=>{
    const E=CAD.estacoes.find(e=>e.id===s.estId);
    const itens=(s.itens||[]).map(it=>{
      const P=E?.pratos.find(p=>p.id===it.pratoId);
      if(!P)return{missing:true,nome:'(prato removido do cadastro)',unidade:'',fator:0,fatorPadrao:0,qtd:0,custoUn:0,custo:0,venda:0};
      const fp=num(P.fator)||0,f=num(it.fator)??fp;let q=n*f;if(INT_UN.has(P.unidade))q=Math.ceil(q-1e-9);
      const cu=custoPrato(P),c=q*cu;
      return{fichaId:(P.fichaId&&fichaById(P.fichaId))?P.fichaId:null,nome:P.nome||'Prato sem nome',unidade:P.unidade||'und',fator:f,fatorPadrao:fp,qtd:q,custoUn:cu,custo:c,venda:c*(1+mc)};
    });
    const custo=sum(itens,'custo');
    return{nome:E?.nome||'(estação removida)',itens,custo,venda:custo*(1+mc)};
  });
  const eq=equipeCalc(d,n,me);
  const extras=d.extras.map(x=>({desc:x.desc||'Item adicional',valor:num(x.valor)||0}));
  const t={n,comidaCusto:sum(est,'custo'),comidaVenda:sum(est,'venda'),equipeCusto:sum(eq,'custo'),equipeVenda:sum(eq,'venda'),extras:sum(extras,'valor'),
    equipeQtd:eq.reduce((s,x)=>s+sum(x.funcoes,'qtd'),0)};
  t.custoTotal=t.comidaCusto+t.equipeCusto+t.extras;t.total=t.comidaVenda+t.equipeVenda+t.extras;t.lucro=t.total-t.custoTotal;t.porPessoa=n?t.total/n:0;
  return{est,eq,extras,t};
}
function vals(c){
  const m={};
  c.est.forEach((s,si)=>{s.itens.forEach((it,ii)=>{m[`e${si}i${ii}q`]=it.missing?'—':`${qf(it.qtd,it.unidade)} ${it.unidade}`;m[`e${si}i${ii}c`]=brl(it.custo);m[`e${si}i${ii}v`]=brl(it.venda)});m[`e${si}c`]=brl(s.custo);m[`e${si}v`]=brl(s.venda)});
  c.eq.forEach((s,si)=>{s.funcoes.forEach((f,fi)=>{m[`s${si}f${fi}a`]=String(f.auto);m[`s${si}f${fi}c`]=brl(f.custo);m[`s${si}f${fi}v`]=brl(f.venda)});m[`s${si}c`]=brl(s.custo);m[`s${si}v`]=brl(s.venda);m[`s${si}q`]=sum(s.funcoes,'qtd')+' prof.'});
  const t=c.t;Object.assign(m,{'t-n':String(t.n),'t-cc':brl(t.comidaCusto),'t-cv':brl(t.comidaVenda),'t-ec':brl(t.equipeCusto),'t-ev':brl(t.equipeVenda),'t-x':brl(t.extras),'t-total':brl(t.total),'t-pp':brl(t.porPessoa),'t-custo':brl(t.custoTotal),'t-lucro':brl(t.lucro),'t-eq':t.equipeQtd+' prof.'});
  return m;
}

  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mod-t"><div class="card-h"><h2 id="mod-t">Novo orçamento</h2><button class="x" data-act="fechar-modal" aria-label="Fechar">×</button></div>

    <span class="eyebrow">Cardápios prontos</span>
    ${CAD.pacotes.length?`<div class="grid2">${CAD.pacotes.map(P=>{const r=pacoteRef(P);return `<button class="opt" data-act="novo-pacote" data-k="${P.id}"><b>${esc(P.nome||'Sem nome')}</b><span>${P.itens.length} itens · ref. ${brl(r.venda)}/pessoa</span></button>`}).join('')}</div>`

let deferred=false;
function renderAllSafe(){const a=document.activeElement;if(a&&a.matches('input,select,textarea')&&a.closest('main')){deferred=true;return}renderAll()}

function renderCad(){
  if(!loaded)return;
  const sub=ui.tab==='pacotes'?'pacotes':(ui.cadSub==='pacotes'?'estacoes':ui.cadSub);
  let h=ui.tab==='pacotes'?'':`<div class="sub" role="group" aria-label="Seção do cadastro">
    <button data-act="cadsub" data-k="estacoes" aria-pressed="${sub==='estacoes'}">Estações e pratos</button>
    <button data-act="cadsub" data-k="equipe" aria-pressed="${sub==='equipe'}">Equipe e mão de obra</button>
    <button data-act="cadsub" data-k="testacao" aria-pressed="${sub==='testacao'}">Tipos de estação</button>
    <button data-act="cadsub" data-k="tipos" aria-pressed="${sub==='tipos'}">Tipos de evento</button>
    <button data-act="cadsub" data-k="porcoes" aria-pressed="${sub==='porcoes'}">Porcionamento</button>
    <button data-act="cadsub" data-k="empresa" aria-pressed="${sub==='empresa'}">Empresa e proposta</button></div>`;
  if(sub==='pacotes'){
    h+=`<p class="hint">Monte os cardápios prontos (Atlas, Atlantidz, Premium…) marcando os pratos de cada estação. No orçamento, o cardápio fixo é carregado e você ainda pode adicionar ou retirar itens. A margem do pacote, se preenchida, substitui a margem padrão.</p>`;
    h+=togAll('pk-all',CAD.pacotes.length).replace(/todas/g,'todos');
    if(!CAD.pacotes.length)h+=`<div class="empty"><strong>Nenhum cardápio pronto</strong>Crie o primeiro, por exemplo “Atlas”.</div>`;
    CAD.pacotes.forEach((P,pi)=>{
      const sel=new Set(P.itens.map(i=>i.estId+'|'+i.pratoId));const r=pacoteRef(P);
      const open=ui.pkOpen.has(P.id);const ref=`${P.itens.length} itens · referência ${brl(r.custo)} de custo e ${brl(r.venda)} de valor por convidado`;

      ${open?`<div class="card-h"><label class="f" style="flex:1 1 200px"><span class="eyebrow">Nome</span><input id="pk-${P.id}" data-f="cad" data-path="pacotes.${pi}.nome" value="${esc(P.nome)}" placeholder="Ex.: Premium" style="font-family:var(--f-display);font-weight:600;font-size:1.05rem"></label>
        <label class="f" style="width:120px">Margem (%)<input id="pkm-${P.id}" class="num" inputmode="decimal" data-f="cad" data-t="n" data-path="pacotes.${pi}.margem" value="${esc(nf(P.margem))}" placeholder="padrão"></label>
        <button class="btn ghost" data-act="rm-pacote" data-i="${pi}">Excluir</button></div>
        <label class="f">Descrição (aparece no PDF)<input id="pkd-${P.id}" data-f="cad" data-path="pacotes.${pi}.descricao" value="${esc(P.descricao)}" placeholder="Ex.: Coquetel completo com ilha de frios e sobremesas finas"></label>
        <div class="pk-grid">${CAD.estacoes.map(E=>`<fieldset class="pk-est"><legend>${esc(E.nome||'Estação')}</legend>${E.pratos.length?E.pratos.map(p=>`<label class="ck"><input type="checkbox" data-act="pk-toggle" data-i="${pi}" data-e="${E.id}" data-p="${p.id}"${sel.has(E.id+'|'+p.id)?' checked':''}> ${esc(p.nome||'Prato')}</label>`).join(''):'<span class="muted" style="font-size:.84rem">Sem pratos</span>'}</fieldset>`).join('')}</div>
        <p class="hint" data-pkref="${pi}">${ref}</p>`:''}</details>`;
    });
    h+=`<div><button class="btn primary" data-act="add-pacote">+ Novo cardápio pronto</button></div>`;
  }
  if(sub==='porcoes'){
    const R=CAD.regras;const f=(k,l,u)=>`<label class="f">${l}<input id="rg-${k}" class="num" inputmode="decimal" data-f="cad" data-t="n" data-path="regras.${k}" value="${esc(nf(R[k]))}"></label>`;
    h+=`<div class="card"><div class="card-h"><h2>Porcionamento padrão</h2></div>
      <p class="hint">Usado ao carregar um cardápio pronto e no botão “Aplicar ao cardápio”. Vale para pratos ligados a fichas técnicas. Torresmo e farofa mantêm a porção da ficha.</p>
      <div class="grid-ev">${f('salgados','Salgados por pessoa (total, un)')}${f('proteinaDupla','Proteína quando há duas (g de cada)')}${f('guarnicao','Cada guarnição (g por pessoa)')}${f('sobremesa','Sobremesa por pessoa (g, total)')}${f('sucoLitros','Suco (litros)')}${f('sucoPessoas','… a cada quantas pessoas')}</div>
      <p class="hint">Com um só prato principal, usa a porção da ficha (180 g de proteína).</p></div>`;
  }
  if(sub==='empresa'){
    const E=CAD.empresa;
    h+=`<div class="card"><div class="card-h"><h2>Empresa e proposta</h2></div><p class="hint">Estes dados aparecem no PDF enviado ao cliente.</p>
      <div class="grid-ev"><label class="f wide">Nome da empresa<input id="emp-nome" data-f="cad" data-path="empresa.nome" value="${esc(E.nome)}" placeholder="Nome que aparece no topo da proposta"></label>
      <label class="f wide">Contato<input id="emp-cont" data-f="cad" data-path="empresa.contato" value="${esc(E.contato)}" placeholder="Telefone, e-mail, Instagram"></label>
      <label class="f" style="grid-column:1/-1">Observações da proposta<input id="emp-obs" data-f="cad" data-path="empresa.obs" value="${esc(E.obs)}" placeholder="Validade, condições de pagamento…"></label></div></div>`;
  }
  if(sub==='testacao'){
    h+=`<div class="card"><div class="card-h"><h2>Tipos de estação</h2></div>
      <p class="hint">Aparecem para escolher ao criar ou editar uma ficha técnica, e organizam as fichas por categoria. A regra de porcionamento define como o app calcula a quantidade por pessoa dos pratos desse tipo.</p>
      <div class="tw"><table class="cad-table"><thead><tr><th>Nome</th><th>Regra de porcionamento</th><th class="n">Fichas</th><th class="w-x"></th></tr></thead><tbody>
      ${CAD.tiposEstacao.map((t,i)=>{const nF=FT.fichas.filter(f=>f.cat===t.nome).length;return `<tr><td style="min-width:160px"><input id="tes-${t.id}" data-f="cad" data-path="tiposEstacao.${i}.nome" value="${esc(t.nome)}" placeholder="Ex.: Ilha de frios"></td>
        <td style="min-width:200px"><select id="ter-${t.id}" data-f="cad" data-path="tiposEstacao.${i}.regra">${Object.entries(REGRAS_TIPO).map(([k,l])=>`<option value="${k}"${k===(t.regra||'')?' selected':''}>${l}</option>`).join('')}</select></td>
        <td class="n">${nF}</td><td>${nF?'':`<button class="x" title="Remover tipo" aria-label="Remover tipo" data-act="rm-testacao" data-i="${i}">×</button>`}</td></tr>`}).join('')}
      </tbody></table></div><div><button class="btn" data-act="add-testacao">+ Adicionar tipo de estação</button></div>
      <p class="hint">Só dá para remover um tipo que não tenha fichas. Para tirar fichas de um tipo, mude o tipo delas em Fichas técnicas.</p></div>`;
  }
  if(sub==='tipos'){
    h+=`<div class="card"><div class="card-h"><h2>Tipos de evento</h2></div>
      <p class="hint">Aparecem como opção ao montar o cardápio de cada orçamento.</p>
      ${CAD.tiposEvento.length?`<div class="tw"><table class="cad-table"><thead><tr><th>Nome</th><th class="w-x"></th></tr></thead><tbody>
      ${CAD.tiposEvento.map((t,i)=>`<tr><td><input id="te-${t.id}" data-f="cad" data-path="tiposEvento.${i}.nome" value="${esc(t.nome)}" placeholder="Ex.: Casamento"></td><td><button class="x" title="Remover" aria-label="Remover tipo" data-act="rm-tipo" data-i="${i}">×</button></td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty"><strong>Nenhum tipo cadastrado</strong>Adicione casamento, aniversário, corporativo…</div>`}
      <div><button class="btn" data-act="add-tipo">+ Adicionar tipo</button></div></div>`;
  }
  if(sub==='estacoes'){
    h+=`<p class="hint">Cada prato tem um <b>fator por pessoa</b> (ex.: salgadinho = 9 und por convidado). No orçamento, a quantidade é convidados × fator, e o custo é quantidade × custo por unidade. Ligue o prato a uma <b>ficha técnica</b> para o custo vir dela e entrar na lista de compras.</p>`;
    h+=togAll('est-all',CAD.estacoes.length);
    if(!CAD.estacoes.length)h+=`<div class="empty"><strong>Nenhuma estação cadastrada</strong>Crie a primeira estação (Entrada, Prato principal, Sobremesa…) e cadastre os pratos dela.</div>`;
    CAD.estacoes.forEach((e,ei)=>{
      const open=ui.estOpen.has(e.id);const lig=e.pratos.filter(p=>p.fichaId&&fichaById(p.fichaId)).length;
      h+=`<details class="card ficha est" data-eid="${e.id}"${open?' open':''}><summary class="card-h"><div><span class="eyebrow">Estação</span><h3 data-estt="${ei}">${esc(e.nome||'Estação sem nome')}</h3><span class="muted" style="font-size:.84rem">${e.pratos.length} prato${e.pratos.length===1?'':'s'}${lig?` · ${lig} ligado${lig===1?'':'s'} a ficha técnica`:''}</span></div>${tog(open)}</summary>
      ${open?`<div class="card-h"><label class="f" style="flex:1 1 240px"><span class="eyebrow">Nome da estação</span><input id="est-${e.id}" data-f="cad" data-path="estacoes.${ei}.nome" value="${esc(e.nome)}" placeholder="Nome da estação" style="font-family:var(--f-display);font-weight:600;font-size:1.05rem"></label>
        <label class="f" style="flex:1 1 200px"><span class="eyebrow">Tipo de estação</span><select id="estt-${e.id}" data-f="cad" data-path="estacoes.${ei}.tipo"><option value="">Sem tipo</option>${CAD.tiposEstacao.map(t=>`<option${t.nome===e.tipo?' selected':''}>${esc(t.nome)}</option>`).join('')}</select></label>
        <button class="btn ghost" data-act="rm-est" data-i="${ei}">Excluir estação</button></div>
        ${e.pratos.length?`<div class="tw"><table class="cad-table"><thead><tr><th>Prato</th><th class="w-un">Unidade</th><th class="n w-num">Fator / pessoa</th><th>Ficha técnica</th><th class="n w-num">Custo / unid. (R$)</th><th class="n">Custo / pessoa</th><th class="w-x"></th></tr></thead><tbody>
        ${e.pratos.map((p,pi)=>`<tr>
          <td style="min-width:180px"><input id="pn-${p.id}" data-f="cad" data-path="estacoes.${ei}.pratos.${pi}.nome" value="${esc(p.nome)}" placeholder="Nome do prato"></td>
          <td><select id="pu-${p.id}" data-f="cad" data-path="estacoes.${ei}.pratos.${pi}.unidade">${UNIDADES.map(u=>`<option${u===p.unidade?' selected':''}>${u}</option>`).join('')}</select></td>
          <td><input id="pf-${p.id}" class="num" inputmode="decimal" data-f="cad" data-t="n" data-path="estacoes.${ei}.pratos.${pi}.fator" value="${esc(nf(p.fator))}" placeholder="0"></td>
          <td style="min-width:170px"><select id="pfi-${p.id}" data-f="cad" data-path="estacoes.${ei}.pratos.${pi}.fichaId"><option value="">Sem ficha (custo manual)</option>${FT_CATS().map(c=>`<optgroup label="${esc(c)}">${FT.fichas.filter(f=>(f.cat||'Outras')===c).map(f=>`<option value="${f.id}"${f.id===p.fichaId?' selected':''}>${esc(f.nome)}</option>`).join('')}</optgroup>`).join('')}</select></td>
          <td>${p.fichaId&&fichaById(p.fichaId)?`<span class="n" style="display:block;text-align:right;font-family:var(--f-num)" title="Custo da ficha técnica">${brl(custoPrato(p))}</span>`:`<input id="pc-${p.id}" class="num" inputmode="decimal" data-f="cad" data-t="n" data-path="estacoes.${ei}.pratos.${pi}.custo" value="${esc(nf(p.custo))}" placeholder="0,00">`}</td>
          <td class="n muted" data-cpp="${ei}.${pi}">${brl((num(p.fator)||0)*custoPrato(p))}</td>
          <td><button class="x" title="Remover prato" aria-label="Remover prato" data-act="rm-prato" data-i="${ei}" data-j="${pi}">×</button></td></tr>`).join('')}
        </tbody></table></div>`:`<p class="hint">Sem pratos nesta estação ainda.</p>`}
        <div><button class="btn" data-act="add-prato" data-i="${ei}">+ Adicionar prato</button></div>`:''}</details>`;
    });
    h+=`<div><button class="btn primary" data-act="add-est">+ Nova estação</button></div>`;
  }
  if(sub==='equipe'){
    const L=equipeCad();const setores=[...new Set(L.map(f=>f.setor))];
    h+=`<p class="hint">Tabela padrão da equipe. As quantidades seguem as regras abaixo e entram sozinhas em cada orçamento. Os valores podem ser reajustados aqui (valem para os próximos orçamentos) ou em cada orçamento.</p>`;
    setores.forEach(st=>{
      h+=`<div class="card"><div class="card-h"><h3>${esc(st)}</h3></div><div class="tw"><table class="cad-table"><thead><tr><th>Função</th><th>Regra de quantidade</th><th class="n w-num">Diurno (R$)</th><th class="n w-num">Noturno (R$)</th></tr></thead><tbody>
      ${L.filter(f=>f.setor===st).map(f=>`<tr><td>${esc(f.nome)}</td><td class="muted" style="font-size:.86rem">${REGRA_TXT[f.regra]}</td>
        <td><input id="ev-d-${f.id}" class="num" inputmode="decimal" data-f="cad" data-t="n" data-path="equipeValores.${f.id}.dia" value="${esc(nf(f.dia))}"></td>
        <td><input id="ev-n-${f.id}" class="num" inputmode="decimal" data-f="cad" data-t="n" data-path="equipeValores.${f.id}.noite" value="${esc(nf(f.noite))}"></td></tr>`).join('')}
      </tbody></table></div></div>`;
    });
    h+=`<div class="card"><div class="card-h"><h3>Exemplo</h3></div><div class="tw"><table><thead><tr><th>Convidados</th>${[80,150,250].map(n=>`<th class="n">${n}</th>`).join('')}</tr></thead><tbody>
      ${L.map(f=>`<tr><td>${esc(f.nome)}</td>${[80,150,250].map(n=>`<td class="n">${qtdRegra(f.regra,n,true)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="hint">Exemplo considerando evento com drinks.</p></div>`;
  }
  $('#p-cadastro').innerHTML=h;
}

/* ---------- 2 · cardápio ---------- */
function renderCardapio(){
  if(!loaded)return;
  const d=DRAFT,c=calc();
  const ed=d.editingId?ORCS.find(o=>o.id===d.editingId):null;
  let h=`<div class="card"><div class="card-h"><h2>Dados do evento</h2>${ed?`<span class="pill warn">Editando ${esc(ed.codigo)}</span>`:''}</div>
    <div class="grid-ev">
      <label class="f wide">Cliente<input id="d-cliente" data-f="draft" data-path="cliente" value="${esc(d.cliente)}" placeholder="Nome do cliente"></label>
      <label class="f">Data<input id="d-data" type="date" data-f="draft" data-path="data" value="${esc(d.data)}"></label>
      <label class="f">Horário<input id="d-hora" type="time" data-f="draft" data-path="horario" value="${esc(d.horario)}"></label>
      <label class="f">Tipo de evento<select id="d-tipo" data-f="draft" data-path="tipoId"><option value="">Selecione…</option>${CAD.tiposEvento.map(t=>`<option value="${t.id}"${t.id===d.tipoId?' selected':''}>${esc(t.nome)}</option>`).join('')}</select></label>
      <label class="f">Convidados<input id="d-conv" class="num" inputmode="numeric" data-f="draft" data-path="convidados" value="${esc(d.convidados)}" placeholder="0"></label>
      <label class="f wide">Local<input id="d-local" data-f="draft" data-path="local" value="${esc(d.local)}" placeholder="Endereço ou nome do espaço"></label>
      <label class="f wide">WhatsApp do cliente<input id="d-tel" type="tel" inputmode="tel" data-f="draft" data-path="telefone" value="${esc(d.telefone||'')}" placeholder="(85) 99999-9999"></label>
    </div></div>`;
  const diff=pacoteDiff();
  h+=`<div class="card"><div class="card-h"><h2>Modelo do cardápio</h2>${diff&&(diff.adicionados.length||diff.removidos.length)?`<span class="pill warn">${esc(diff.pacote.nome)} com alterações</span>`:''}</div>
    <div class="models">
      <button class="model" data-act="modelo" data-k="" aria-pressed="${!d.pacoteId}"><b>Personalizado</b><span>Monte estação por estação</span></button>
      ${CAD.pacotes.map(P=>{const r=pacoteRef(P);return `<button class="model" data-act="modelo" data-k="${P.id}" aria-pressed="${d.pacoteId===P.id}"><b>${esc(P.nome||'Sem nome')}</b><span>${P.itens.length} itens · ref. ${brl(r.venda)}/pessoa</span></button>`}).join('')}
    </div>
    ${!CAD.pacotes.length?`<p class="hint">Cadastre cardápios prontos em Dados › Cardápios prontos.</p>`:''}
    ${diff?`<div class="diff"><span>Base: <b>${esc(diff.pacote.nome)}</b>.</span>
      ${diff.adicionados.length?`<span class="add">Adicionado: ${diff.adicionados.map(esc).join(', ')}</span>`:''}
      ${diff.removidos.length?`<span class="rem">Retirado: ${diff.removidos.map(esc).join(', ')}</span>`:''}
      ${!diff.adicionados.length&&!diff.removidos.length?`<span class="muted">Sem alterações. Adicione ou retire itens nas estações abaixo.</span>`:`<button class="btn ghost" style="color:var(--accent)" data-act="modelo-reset">Restaurar ${esc(diff.pacote.nome)}</button>`}</div>`:''}
  </div>`;
  h+=`<div class="card"><div class="card-h"><h2>Observações do evento</h2></div>
    <p class="hint">Saem no PDF do cliente, antes das observações padrão da empresa. Ex.: restrições alimentares, horário de serviço, itens fornecidos pelo cliente, condições combinadas.</p>
    <textarea id="d-obs" class="obs-ta" data-f="draft" data-path="observacoes" placeholder="Ex.: 10 convidados vegetarianos. Serviço de buffet das 20h às 23h. Bolo fornecido pelo cliente.">${esc(d.observacoes||'')}</textarea></div>`;
  h+=togAll('dest-all',d.estacoes.length);
  d.estacoes.forEach((s,si)=>{
    const E=CAD.estacoes.find(e=>e.id===s.estId);const cs=c.est[si];
    const used=new Set(s.itens.map(i=>i.pratoId));
    const disp=(E?.pratos||[]).filter(p=>!used.has(p.id));
    const op=!ui.dFechadas.has(s.estId);
    h+=`<details class="card ficha station dest" data-dest="${s.estId}"${op?' open':''}><summary class="card-h"><div><span class="eyebrow">Estação · ${s.itens.length} ${s.itens.length===1?'item':'itens'}</span><h3>${esc(cs.nome)}</h3>
      <div class="tot"><span class="muted" style="font-size:.84rem">custo ${V(`e${si}c`)}</span> <span class="st-total">${V(`e${si}v`)}</span></div></div>${tog(op)}</summary>
      ${s.itens.length?`<div class="tw"><table><thead><tr><th>Prato</th><th class="n w-num">Fator / pessoa</th><th class="n">Quantidade</th><th class="n">Custo</th><th class="n">Valor</th><th class="w-x"></th></tr></thead><tbody>
      ${s.itens.map((it,ii)=>{const ci=cs.itens[ii];return `<tr><td>${esc(ci.nome)}${ci.missing?'':` <span class="muted" style="font-size:.8rem">· ${brl(ci.custoUn)}/${esc(ci.unidade)}</span>`}</td>
        <td><input id="df-${si}-${it.pratoId}" class="num" inputmode="decimal" data-f="draft" data-path="estacoes.${si}.itens.${ii}.fator" value="${esc(nf(it.fator))}" placeholder="${esc(nf(ci.fatorPadrao))}" title="Deixe vazio para usar o padrão do cadastro"></td>
        <td class="n">${V(`e${si}i${ii}q`)}</td><td class="n muted">${V(`e${si}i${ii}c`)}</td><td class="n">${V(`e${si}i${ii}v`)}</td>
        <td><button class="x" title="Remover item" aria-label="Remover item" data-act="d-rm-item" data-i="${si}" data-j="${ii}">×</button></td></tr>`}).join('')}
      </tbody></table></div>`:`<p class="hint">Escolha abaixo os itens desta estação.</p>`}
      ${disp.length?`<div class="row-add"><select id="addp-${si}" aria-label="Prato para adicionar"><option value="">Escolher prato de ${esc(cs.nome)}…</option>${disp.map(p=>`<option value="${p.id}">${esc(p.nome)} — ${esc(nf(p.fator))} ${esc(p.unidade)}/pessoa</option>`).join('')}</select>
        <button class="btn" data-act="d-add-item" data-i="${si}">+ Adicionar item</button>${disp.length>1?`<button class="btn ghost" style="color:var(--accent)" data-act="d-add-all" data-i="${si}">Adicionar todos</button>`:''}</div>`
      :`<p class="hint">${E?'Todos os pratos desta estação já estão no cardápio.':'Esta estação foi removida do cadastro.'}</p>`}
      <div><button class="btn ghost" data-act="d-rm-est" data-i="${si}">Retirar estação do cardápio</button></div>
    </details>`;
  });
  const usedE=new Set(d.estacoes.map(s=>s.estId));
  const dispE=CAD.estacoes.filter(e=>!usedE.has(e.id));
  h+=`<div class="card"><div class="card-h"><h3>${d.estacoes.length?'Adicionar outra estação':'Escolha a primeira estação'}</h3></div>
    ${CAD.estacoes.length?(dispE.length?`<div class="row-add"><select id="adde" aria-label="Estação"><option value="">Tipo de estação…</option>${dispE.map(e=>`<option value="${e.id}">${esc(e.nome||'Estação sem nome')} (${e.pratos.length} pratos)</option>`).join('')}</select><button class="btn primary" data-act="d-add-est">+ Adicionar estação</button></div>`:`<p class="hint">Todas as estações cadastradas já estão no cardápio.</p>`)
    :`<p class="hint">Cadastre estações e pratos em Dados › Cadastro.</p>`}</div>`;
  const R=CAD.regras;
  h+=`<div class="card"><div class="card-h"><h3>Porcionamento padrão</h3><button class="btn" data-act="aplicar-regras">Aplicar ao cardápio</button></div>
    <p class="hint">${nf(R.salgados)} salgados por pessoa divididos entre os tipos · ${nf(R.proteinaDupla)} g de cada proteína quando há duas · ${nf(R.guarnicao)} g por guarnição · ${nf(R.sucoLitros)} L de suco a cada ${nf(R.sucoPessoas)} pessoas · ${nf(R.sobremesa)} g de sobremesa por pessoa. Ajuste as regras em Dados › Cadastro › Porcionamento.</p><span class="msg ok" id="reg-msg" role="status"></span></div>`;
  h+=`<div class="card"><div class="card-h"><h3>Resumo do cardápio</h3>${margemCampo('margemComida','Margem sobre comida','d-mc')}</div>
    <div class="tw"><table><thead><tr><th>Estação</th><th class="n">Custo</th><th class="n">Valor</th></tr></thead><tbody>
    ${c.est.map((s,si)=>`<tr><td>${esc(s.nome)}</td><td class="n muted">${V(`e${si}c`)}</td><td class="n">${V(`e${si}v`)}</td></tr>`).join('')||`<tr><td colspan="3" class="muted">Nenhuma estação selecionada.</td></tr>`}
    </tbody><tfoot><tr><td>Total das estações</td><td class="n muted">${V('t-cc')}</td><td class="n">${V('t-cv')}</td></tr></tfoot></table></div></div>`;
  $('#p-cardapio').innerHTML=h;refresh();
}

/* ---------- 3 · custos adicionais ---------- */
function renderCustos(){
  if(!loaded)return;

function resumoCliente(o){
  const t=o.totais,emp=CAD.empresa||{};

  if(o.pacoteNome)s+=`Cardápio: ${o.pacoteNome}\n`;
  o.estacoes.forEach(e=>{s+=`\n*${e.nome}*\n`+e.itens.map(i=>`• ${i.nome}`).join('\n')+'\n'});
  if(o.observacoes)s+=`\n*Observações*\n${o.observacoes}\n`;
  s+=`\n*Valor total: ${brl(t.total)}*\n(${brl(t.porPessoa)} por convidado)\n`;

    const ests=[...o.estacoes].sort((a,b)=>pos(a.nome)-pos(b.nome));
    const secs=ests.map(s=>{const linhas=s.itens.map(i=>doc.splitTextToSize(i.nome,colW-6));return{nome:titulo(s.nome),linhas,h:hH+linhas.reduce((t,l)=>t+l.length*lh,0)+5}});
    const tot=secs.reduce((t,s)=>t+s.h,0);let acc=0,cut=secs.length;
    for(let i=0;i<secs.length;i++){if(acc+secs[i].h/2>=tot/2){cut=Math.max(1,i+(acc+secs[i].h-tot/2<tot/2-acc?1:0));break}acc+=secs[i].h}
    if(secs.length===1)cut=1;
    const sec=(s,x,yy)=>{doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...BLUE);doc.text(s.nome,x,yy);
      const tw=doc.getTextWidth(s.nome);doc.setDrawColor(...BLUE);doc.setLineWidth(.45);doc.line(x,yy+1.2,x+tw,yy+1.2);yy+=7;

    let yL=y,yR=y;
    secs.slice(0,cut).forEach(s=>{if(yL+s.h>H-30&&yL>y){doc.addPage();topo();yL=36;yR=36}yL=sec(s,M,yL)});
    secs.slice(cut).forEach(s=>{if(yR+s.h>H-30){doc.addPage();topo();yR=36;yL=36}yR=sec(s,M+CW/2+4,yR)});
    y=Math.max(yL,yR)+2;
    // bloco do pacote (estrela + faixa) e valores
    const bloco=50;if(y+bloco>H-14){doc.addPage();topo();y=40}
    y+=8;
    const cx=M+8,cy=y+9;doc.setFillColor(...NAVY);
    const pts=[[0,-17],[2.2,-2.2],[15,0],[2.2,2.2],[0,17],[-2.2,2.2],[-15,0],[-2.2,-2.2]];
    {const P=pts.map(p=>[cx+p[0],cy+p[1]]);for(let i=0;i<8;i+=2){const t=P[i],a1=P[(i+7)%8],b1=P[i+1];doc.triangle(t[0],t[1],a1[0],a1[1],b1[0],b1[1],'F')}doc.triangle(P[1][0],P[1][1],P[3][0],P[3][1],P[5][0],P[5][1],'F');doc.triangle(P[1][0],P[1][1],P[5][0],P[5][1],P[7][0],P[7][1],'F')}
    const lx=cx+5,lw=Math.min(105,CW-10);doc.setFillColor(...LABEL);doc.setDrawColor(255,255,255);doc.setLineWidth(.6);doc.roundedRect(lx,cy+1,lw,13,2.2,2.2,'FD');
    const rot=o.pacoteNome?`Pacote ${o.pacoteNome}`.replace(/^Pacote Pacote/,'Pacote'):'Cardápio Personalizado';
    doc.setFont('Saira','normal');doc.setFontSize(23);doc.setTextColor(255,255,255);doc.text(rot,lx+lw/2,cy+10.6,{align:'center'});
    let yy=cy+25;doc.setFont('helvetica','normal');doc.setFontSize(12);color(INK);
    doc.text(`Evento para ${o.convidados} convidados`,M+4,yy);yy+=6;
    doc.setFont('helvetica','bold');doc.text(`${brl(o.totais.porPessoa)} por pessoa`,M+4,yy);yy+=6;
    doc.text(`Valor total: ${brl(o.totais.total)}`,M+4,yy);yy+=8;
    y=yy+2;
    if(o.observacoes){
      const ls=doc.splitTextToSize(o.observacoes,CW);if(y+12+ls.length*5>H-16){doc.addPage();topo();y=36}
      doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...BLUE);doc.text('Observações',M,y);doc.line(M,y+1.2,M+doc.getTextWidth('Observações'),y+1.2);y+=7;
      doc.setFont('helvetica','normal');doc.setFontSize(10.5);color(INK);ls.forEach(l=>{doc.text(l,M,y);y+=5});y+=4;
    }
    yy=y;if(emp.obs){if(yy>H-22){doc.addPage();topo();yy=40}doc.setFont('helvetica','normal');doc.setFontSize(10);color(MUT);doc.splitTextToSize(emp.obs,CW-4).forEach(l=>{doc.text(l,M,yy);yy+=4.6})}
    // rodapé
    const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8.5);color(MUT);
      doc.text(emp.contato||'(85) 3120.8717   ·   @atlantidzoficial   ·   atlantidz.com.br',W/2,H-9,{align:'center'});if(n>1)doc.text(`${i}/${n}`,W-M,H-9,{align:'right'})}
    const nome=`Proposta ${(o.cliente||'cliente').replace(/[^\p{L}\p{N} _-]/gu,'').trim()} ${o.codigo}.pdf`;
    const buf=doc.output('arraybuffer');
    if(modo==='share'){try{const f=new File([buf],nome,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nome,text:`Proposta ${o.codigo}`});m.className='msg ok';m.textContent='PDF compartilhado';return 'shared'}}catch(e){if(e?.name==='AbortError'){m.className='msg';m.textContent='Envio cancelado';return false}}}
    const dl=await getDl();if(!dl){m.className='msg';m.textContent='Download indisponível nesta visualização.';return false}
    await dl.save({filename:nome,data:buf});
    m.className='msg ok';m.textContent='PDF salvo';ok=true;
  }catch(e){
    m.className='msg';m.textContent=e?.code==='declined'?'Download cancelado':'Não foi possível gerar o PDF';console.error(e);
  }finally{btn.disabled=false;setTimeout(()=>{if(m.isConnected)m.textContent=''},3500)}
  return ok;
}

    case 'eq-all':if(k)calc().eq.forEach(S=>ui.eqOpen.add(S.nome));else ui.eqOpen.clear();renderCustos();break;
    case 'eq-reset':DRAFT.eqAjuste={};saveDraft();renderCustos();renderBar();break;
    case 'orc-sel':ui.orcSel=k;ui.justSaved=null;renderOrc();break;
    case 'orc-filtro':ui.orcFiltro=k;ui.orcSel=null;ui.justSaved=null;renderOrc();break;
    case 'orc-pronto':{const o=ORCS.find(x=>x.id===ui.orcSel);if(!o)break;o.pronto=!o.pronto;try{await saveOrc(o)}catch(err){console.error(err)}ui.orcFiltro=o.pronto?'prontos':'criados';renderOrc();const m=$('#orc-msg');if(m){m.className='msg ok';m.textContent=o.pronto?'Movido para orçamentos prontos':'Movido para criados'}break}
    case 'toggle-int':ui.showInt=b.checked;renderOrc();break;
    case 'orc-copy':{const o=ORCS.find(x=>x.id===ui.orcSel);const txt=resumo(o);const m=$('#orc-msg');
      try{await navigator.clipboard.writeText(txt);m.textContent='Resumo copiado'}catch{m.textContent='Não foi possível copiar'}setTimeout(()=>{if(m)m.textContent=''},2500);break}
    case 'orc-edit':case 'orc-dup':{const o=ORCS.find(x=>x.id===ui.orcSel);DRAFT=Object.assign(emptyDraft(),clone(o.draft||{}),{editingId:a==='orc-edit'?o.id:null});saveDraft();setTab('cardapio');break}
    case 'orc-del':if(b.dataset.armed){const id=ui.orcSel;try{await delOrc(id);ui.orcSel=null;if(DRAFT.editingId===id){DRAFT.editingId=null;saveDraft()}renderOrc()}catch(err){$('#orc-msg').textContent='Não foi possível excluir'}}else arm(b,'Confirmar exclusão');break;
    case 'novo':DRAFT=emptyDraft();saveDraft();setTab('cardapio');break;
    case 'abrir-novo':abrirNovo();break;
    case 'marg-modo':{DRAFT.margemModo=Object.assign({},DRAFT.margemModo,{[k]:b.dataset.v});saveDraft();if(ui.tab==='custos')renderCustos();else renderCardapio();const inp=document.querySelector(`[data-marg="${k}"]`);inp?.focus();break}
    case 'salvar-tudo':salvarTudo();break;
    case 'descartar':if(b.dataset.armed){descartarTudo()}else arm(b,'Confirmar descarte');break;
    case 'salvar-tudo-m':fecharModal();await salvarTudo();break;
    case 'descartar-m':fecharModal();descartarTudo();break;
    case 'atualizar-dados':atualizarDados();break;
    case 'sair-salvar':{fecharModal();await salvarTudo();setTab(ui.pendTab);break}
    case 'sair-descartar':{fecharModal();descartarTudo();setTab(ui.pendTab);break}
    case 'aplicar-regras':{const n=aplicarRegras();saveDraft();renderCardapio();renderBar();const m=$('#reg-msg');if(m)m.textContent=n?`Porcionamento aplicado a ${n} itens`:'Nenhum item ligado a ficha técnica';break}
    case 'fechar-modal':fecharModal();break;
    case 'novo-continuar':fecharModal();setTab('cardapio');break;
    case 'novo-pers':fecharModal();DRAFT=emptyDraft();saveDraft();setTab('cardapio');break;
    case 'novo-pacote':fecharModal();DRAFT=emptyDraft();loadPacote(k);saveDraft();setTab('cardapio');break;
    case 'orc-compras':gerarCompras(b);break;
    case 'gerar-compras':{const d=await gerar();if(d){await gerarCompras(null,d);abrirWhats(d)}break}
    case 'ftsub':ui.ftSub=k;renderFichas();break;
    case 'ftcat':ui.ftCat=k;renderFichas();break;
    case 'ft-add-item':{const v=$('#ftadd-'+i).value;if(!v)return;FT.fichas[i].itens.push({i:v,q:''});saveFT();renderFichas();$(`#ftq-${FT.fichas[i].id}-${FT.fichas[i].itens.length-1}`)?.focus();break}
    case 'ft-rm-item':FT.fichas[i].itens.splice(j,1);saveFT();renderFichas();break;
    case 'ft-rm':if(b.dataset.armed){FT.fichas.splice(i,1);saveFT();renderFichas();if(ui.tab==='fichas')renderCad()}else arm(b,'Confirmar exclusão');break;
    case 'ft-add':{const f={id:'f-'+uid(),nome:'',cat:ui.ftCat||'Outras',rend:'10 porções',n:10,und:'porção',itens:[]};FT.fichas.push(f);ui.ftOpen.add(f.id);saveFT();renderFichas();$('#ftn-'+f.id)?.focus();break}
    case 'ins-add':{const I={id:uid(),nome:'',cat:'Outros',und:'kg',preco:''};FT.insumos.unshift(I);ui.ftQ='';saveFT();renderFichas();$('#in-'+I.id)?.focus();break}
    case 'ins-rm':{const I=FT.insumos[i];const usado=FT.fichas.filter(f=>f.itens.some(x=>x.i===I.id));if(usado.length){alert(`Esse insumo está em ${usado.length} ficha(s): ${usado.slice(0,4).map(f=>f.nome).join(', ')}${usado.length>4?'…':''}. Retire das fichas antes de excluir.`);break}
      if(b.dataset.armed){FT.insumos.splice(i,1);saveFT();renderFichas()}else{b.dataset.armed='1';b.textContent='?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='×'}},3000)}break}
    case 'ft-modelo':baixarModelo(b);break;
    case 'imp-novo':ui.imp.novos[i].add=b.checked;renderFichas();break;
    case 'imp-apply':aplicarImport();break;
    case 'imp-cancel':ui.imp=null;renderFichas();break;
  }
});
/* porcionamento padrão */
const gramas=F=>{const m=String(F?.rend||'').match(/\((\d+(?:[.,]\d+)?)\s*g/i);return m?num(m[1]):null};
const litrosPorc=F=>{const m=String(F?.rend||'').match(/(\d+(?:[.,]\d+)?)\s*L/);const L=m?num(m[1]):null;return L&&num(F.n)?L/num(F.n):null};
function aplicarRegras(d=DRAFT){
  const R=CAD.regras||{};const its=[];
  d.estacoes.forEach(s=>{const E=CAD.estacoes.find(e=>e.id===s.estId);s.itens.forEach(it=>{const P=E?.pratos.find(p=>p.id===it.pratoId);const F=P?.fichaId?fichaById(P.fichaId):null;if(F)its.push({it,F})})});
  const regraDe=F=>(CAD.tiposEstacao||[]).find(t=>t.nome===F.cat)?.regra||'';const grp=r=>its.filter(x=>regraDe(x.F)===r);const r3=v=>String(Math.round(v*1000)/1000);let n=0;
  const sal=grp('salgados').filter(x=>x.F.und==='un');sal.forEach(x=>{x.it.fator=r3((num(R.salgados)||9)/sal.length);n++});
  const pp=grp('proteina');if(pp.length>1)pp.forEach(x=>{const g=gramas(x.F);if(g){x.it.fator=r3((num(R.proteinaDupla)||100)/g);n++}});else pp.forEach(x=>{x.it.fator='';n++});
  grp('guarnicao').filter(x=>!/torresmo|farofa/i.test(x.F.nome)).forEach(x=>{const g=gramas(x.F);if(g){x.it.fator=r3((num(R.guarnicao)||150)/g);n++}});
  const suc=grp('bebidas').filter(x=>/^suco/i.test(x.F.nome));const lpp=(num(R.sucoLitros)||2)/(num(R.sucoPessoas)||4);
  suc.forEach(x=>{const l=litrosPorc(x.F);if(l){x.it.fator=r3(lpp/l/suc.length);n++}});
  const sob=grp('sobremesa');sob.forEach(x=>{const g=gramas(x.F);if(g){x.it.fator=r3((num(R.sobremesa)||120)/sob.length/g);n++}});
  return n;
}
function loadPacote(id){
  const P=CAD.pacotes.find(p=>p.id===id);if(!P)return;
  DRAFT.pacoteId=id;
  DRAFT.estacoes=CAD.estacoes.filter(E=>P.itens.some(i=>i.estId===E.id)).map(E=>({estId:E.id,itens:E.pratos.filter(p=>P.itens.some(i=>i.estId===E.id&&i.pratoId===p.id)).map(p=>({pratoId:p.id,fator:''}))}));
  if(num(P.margem)!=null)DRAFT.margemComida=String(num(P.margem));
  aplicarRegras();
}
function addSetor(id){const S=CAD.setores.find(s=>s.id===id);DRAFT.equipe.push({setorId:id,funcoes:(S?.funcoes||[]).map(f=>({funcaoId:f.id,qtd:''}))})}
function arm(b,t){const o=b.textContent;b.dataset.armed='1';b.textContent=t;b.classList.add('danger');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o}},4000)}
function focusLast(sel){const all=document.querySelectorAll(sel);all[all.length-1]?.focus()}

/* ---------- início ---------- */
setTab(ui.tab);
(async()=>{
  try{db=await window.__getDb()}catch(e){console.error(e);db=null}
  if(db){
    mode='db';let gotCad=false,gotOrc=false,gotFT=false;
    const ready=()=>{if(gotCad&&gotOrc&&gotFT&&!loaded){loaded=true;status('Sincronizado','ok');const mv=sincronizarPratos();renderAll();setTab(ui.tab);if(mv.length)toast(`${mv.length} prato(s) estão em estação diferente da ficha. Toque em “Salvar alterações” para atualizar.`)}};
    db.doc('config/cadastro').onSnapshot(s=>{
      lastCadSnap=s.exists?clone(s.data()):{};if(!cadPending&&!cadTimer)CAD=normCad(clone(lastCadSnap));
      gotCad=true;if(loaded)renderAllSafe();else ready();
    },err=>{status('Sem conexão com os dados','err');console.error(err)});
    db.doc('config/fichas').onSnapshot(s=>{
      lastFTSnap=s.exists?clone(s.data()):{};if(!ftPending&&!ftTimer)FT=normFT(clone(lastFTSnap));
      gotFT=true;if(loaded){const a=document.activeElement;if(!(a&&a.matches('input,select,textarea')&&a.closest('main'))){renderFichas();if(ui.tab==='cadastro')renderCad()}}else ready();
    },err=>{gotFT=true;console.error(err);ready()});
    db.collection('orcamentos').orderBy('criadoEm','desc').onSnapshot(s=>{
      ORCS=s.docs.map(d=>clone(d.data()));gotOrc=true;if(loaded){if(ui.tab==='orcamento')renderOrc();if(ui.tab==='capa')renderCapa()}else ready();
    },err=>{console.error(err)});
  }else{
    mode='local';CAD=normCad(LS.get('pe_cad',null));FT=normFT(LS.get('pe_ft',null));ORCS=LS.get('pe_orcs',[]);loaded=true;status('Salvando neste navegador');renderAll();setTab(ui.tab);
  }
})();
